[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrill-lazy-router"
version = "0.2.11"
description = "Native Ubuntu and DD-WRT policy routing controls for Astrill"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lachlan Chen" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]
windows = [
  "PySide6>=6.8; sys_platform == 'win32'",
  "pyinstaller>=6.10; sys_platform == 'win32'"
]

[project.scripts]
astrill-lazy = "astrill_lazy.cli:main"
astrill-lazy-gui = "astrill_lazy.application:main"

[project.gui-scripts]
astrill-lazy-windows = "astrill_lazy.windows_app:main"

[tool.setuptools]
package-dir = { "" = "desktop" }

[tool.setuptools.packages.find]
where = ["desktop"]

[tool.setuptools.data-files]
"share/astrill-lazy/extensions/core-catalog" = [
  "extensions/core-catalog/manifest.json",
  "extensions/core-catalog/services-core.json",
  "extensions/core-catalog/services-ai-development.json",
  "extensions/core-catalog/services-global-communication.json",
  "extensions/core-catalog/services-global-daily.json",
  "extensions/core-catalog/services-china.json",
  "extensions/core-catalog/service-countries.json",
  "extensions/core-catalog/regions.json"
]
"share/astrill-lazy/router" = [
  "router/alctl",
  "router/alapi",
  "router/alpage",
  "router/bootstrap.sh",
  "router/VERSION"
]
"share/astrill-lazy/schemas" = [
  "schemas/device-policy-v1.schema.json"
]
"libexec" = ["helpers/astrill-lazy-netns"]
"share/applications" = [
  "data/io.github.lachlanchen.AstrillLazyRouter.desktop"
]
"share/metainfo" = [
  "data/io.github.lachlanchen.AstrillLazyRouter.metainfo.xml"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["desktop"]
