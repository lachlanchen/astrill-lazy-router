name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install shell checks
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Install development package
        run: python -m pip install --upgrade pip wheel && python -m pip install --editable ".[dev]"

      - name: Test
        run: pytest

      - name: Validate catalog
        run: python scripts/validate-catalog.py

      - name: Lint Python
        run: >-
          ruff check desktop tests scripts/validate-catalog.py &&
          ruff format --check desktop tests scripts/validate-catalog.py

      - name: Check shell
        run: >-
          shellcheck -x -s sh
          scripts/install-desktop.sh
          scripts/install-novnc-service.sh
          scripts/run-novnc-debug.sh
          scripts/uninstall-desktop.sh
          scripts/uninstall-novnc-service.sh
          helpers/astrill-lazy-netns
          helpers/astrill-lazy-profile-runner
          contrib/macos/install-uuremote-route-reporter.sh
          contrib/macos/uuremote-route-reporter.sh
          contrib/portable/install-agent.sh
          contrib/portable/uninstall-agent.sh
          router/alapi
          router/alpage
          router/alpage-ui
          router/bootstrap.sh

      # alctl exports shared state to a digest-verified, dynamically sourced
      # RAM module. ShellCheck cannot follow that runtime path, and its
      # A && B || fail blocks intentionally treat any failed guard as failure.
      - name: Check modular router controller shell
        run: >-
          shellcheck -e SC1090,SC2034,SC2015 -x -s sh router/alctl
          router/alhybrid

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/wheel .
